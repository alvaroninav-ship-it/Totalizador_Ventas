<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Totalizador de Ventas</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>

<body>

  <h1>Totalizador de Ventas</h1>
  <form id="ventas-form">
    <table class="totalizador">
      <tr>
        <td class="label">
          <label for="cantidad">Cantidad de item</label>
        </td>
        <td>
          <input type="number" id="cantidad">
        </td>
        <td></td>
      </tr>
      <tr>
        <td class="label">
          <label for="precio">Precio por item:</label>
        </td>
        <td>
          <input type="number" id="precio" step="0.01">
        </td>
        <td>
          <input type="submit" value="Totalizar" id="calcular-total-button">
        </td>
      </tr>
      <tr>
        <td class="label">
          <label for="estado">Estado:</label>
        </td>
        <td>
          <select type="select" id="estado">
            <option value="CA">CA </option>
            <option value="UT">UT </option>
            <option value="NV">NV</option>
            <option value="TX">TX  </option>
            <option value="AL">AL </option>
            <option value="UT">UT </option>
          </select>
        </td>
        <td>
        </td>
      </tr>
      <tr>
        <td class="label">
          <label for="categoria">Categoria Producto:</label>
        </td>
        <td>
          <select type="select" id="categoria">
            <option value="Alimentos">Alimentos</option>
            <option value="Bebidas alcohólicas">Bebidas alcohólicas</option>
            <option value="Material de escritorio">Material de escritorio</option>
            <option value="Muebles">Muebles </option>
            <option value="Electrónicos">Electrónicos	 </option>
            <option value="Vestimenta">Vestimenta </option>
            <option value="Varios">Varios	</option>
          </select>
        </td>
        <td>
        </td>
      </tr>
      <tr>
        <td class="label">
          <label for="peso">Peso del item:</label>
        </td>
        <td>
          <input type="number" id="peso" step="0.01">
        </td>
        <td>
        </td>
      </tr>
      <tr>
        <td class="label">
          <label for="descuento">Descuento:</label>
        </td>
        <td>
          <div id="descuento-div"></div>
        </td>
        <td></td>
      </tr>
      <tr>
        <td class="label">
          <label for="impuesto">Impuesto:</label>
        </td>
        <td>
          <div id="impuesto-div"></div>
        </td>
        <td></td>
      </tr>
      <tr>
        <td colspan="3">
          <div id="resultado-div"></div>
        </td>
      </tr>
    </table>
  </form>
  <script type="module" src="./src/presenter.js"></script>

</body>
</html>
